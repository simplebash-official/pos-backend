[package]
name = "jana2u_pos_backend"
version = "0.1.0"
edition = "2024"
default-run = "jana2u_pos_backend"

[dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
bson = { version = "3.1.0", features = ["chrono-0_4"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.33"
# `jsonwebtoken` 11's default features include no crypto backend at all —
# `decode`/`encode` panic at runtime ("Could not automatically determine the
# process-level CryptoProvider") without one of `rust_crypto`/`aws_lc_rs`
# explicitly enabled. `rust_crypto` covers HS256 (the algorithm used here)
# with pure-Rust deps, no C bindings.
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
# `bson-3` makes `mongodb::bson` re-export bson 3.x (matching the direct
# `bson` dependency above) instead of the bson 2.x it pulls in by default;
# without it, `chrono::DateTime<Utc>` fields on Mongo documents can't use
# bson's chrono-0_4 serde helpers.
mongodb = { version = "3.8.0", features = ["bson-3"] }
nanoid = "0.5.0"
rand = "0.10.2"
regex = "1.11.1"
# Outbound HTTP client used solely by `clients::document_server` to call the
# sibling document-server for PDF rendering — no default features (no
# system TLS dependency), rustls + JSON body support only.
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
# Pre-validates print payloads against the document-server's published
# template schemas (`dataSchema` from `GET /api/templates`) before sending a
# render — fail fast with field-level errors instead of round-tripping to
# that service's identical rejection.
jsonschema = "0.50"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.22.1"
sha2 = "0.10.8"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "reqwest"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json"] }
