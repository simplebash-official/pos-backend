[package]
name = "pos-calc-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
utoipa = { version = "5.5.0", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
tsify = { version = "0.4.5", default-features = false, features = ["js"], optional = true }

[features]
default = []
utoipa = ["dep:utoipa"]
tsify = ["dep:tsify", "dep:wasm-bindgen"]
