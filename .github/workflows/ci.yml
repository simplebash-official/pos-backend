name: CI

on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The tests build their own configuration; they only need the database. `jt*` marks a
      # throwaway database, and the harness refuses any other name.
      # directConnection: talk to the single replica-set member started below
      # as-is, without discovering the set by its advertised hostname.
      MONGODB_URI: mongodb://localhost:27017/?directConnection=true
      MONGODB_TEST_DB_NAME: jtci_github_actions
    steps:
      - uses: actions/checkout@v4
      # The label and document schema-drift tests read document-server's
      # published schemas from a sibling checkout (`../document-server`), the
      # same layout as on a developer machine. The label test fails without it.
      - uses: actions/checkout@v4
        with:
          repository: simplebash-official/document-server
          path: document-server
          persist-credentials: false
      - name: Place document-server beside this repo
        run: mv document-server ../document-server
      # Cloud sync reads MongoDB change streams, which only exist on a replica
      # set, so a plain `services: mongo` container can't run those tests.
      # `services` can't pass `--replSet`, hence a step: a one-node set.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for i in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'rs.status().myState')" = "1" ] && exit 0
            sleep 2
          done
          echo "MongoDB replica set did not become primary" >&2
          exit 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The calculations crate must still build for the browser.
      - run: cargo check -p pos-calc-wasm --target wasm32-unknown-unknown
      - run: cargo test --workspace
