name: Test, build and deploy

# Pull requests: tests only (ci.yml).
# Push to master (or "Run workflow"): test -> build the image on the runner ->
# deploy. Docs-only and graphify-only commits are skipped so they don't spend
# Actions minutes. The server never builds; it only pulls the image from GHCR.
#
# The deploy step SSHes in with a key that can only run the server's
# /opt/simplebash/bin/ci-deploy script (see pos-compose: scripts/ci-deploy.sh):
# pull, restart, wait for the healthcheck, and roll back to the previous image
# if the new one is unhealthy.
#
# Repo secrets: DEPLOY_HOST, DEPLOY_SSH_KEY (restricted key),
# DEPLOY_KNOWN_HOSTS (the server's pinned host keys).

on:
  push:
    branches: ["master"]
    paths-ignore:
      - "**.md"
      - "graphify-out/**"
      - "docs/**"
      - ".claude/**"
      - ".agents/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/simplebash-official/pos-backend
  SERVICE: backend

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to the server (rolls back automatically if unhealthy)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "ubuntu@${DEPLOY_HOST}" "$SERVICE"
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
